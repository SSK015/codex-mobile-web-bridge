<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Codex-WebBridge architecture</title>
  <desc id="desc">A phone browser connects through Codex-WebBridge to Codex Desktop and its App Server.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef8f5"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2da44e"/>
      <stop offset="1" stop-color="#1f883d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2328" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#57606a"/>
    </marker>
    <style>
      .heading{font:700 28px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f2328}
      .label{font:700 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f2328}
      .bridge-label{font:700 22px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#fff}
      .box{fill:#fff;stroke:#d0d7de;stroke-width:1.5}
    </style>
  </defs>

  <rect id="surface" width="1200" height="360" rx="28" fill="url(#background)"/>
  <text class="heading" x="600" y="62" text-anchor="middle">Codex-WebBridge</text>

  <path d="M272 207H342" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M592 207H662" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M912 207H982" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect class="box" x="52" y="132" width="220" height="150" rx="24"/>
    <rect x="82" y="164" width="40" height="40" rx="11" fill="#ddf4ff"/>
    <path d="M93 171h18a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H93a4 4 0 0 1-4-4v-20a4 4 0 0 1 4-4zm4 23h10" fill="none" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="162" y="237" text-anchor="middle">Phone Browser</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="342" y="116" width="250" height="182" rx="28" fill="url(#bridge)"/>
    <circle cx="467" cy="165" r="23" fill="#fff" opacity=".18"/>
    <path d="M454 165h26m-13-13v26" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text class="bridge-label" x="467" y="235" text-anchor="middle">Codex-WebBridge</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="box" x="662" y="132" width="250" height="150" rx="24"/>
    <rect x="692" y="163" width="43" height="33" rx="5" fill="none" stroke="#0969da" stroke-width="3"/>
    <path d="M704 203h19" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="787" y="237" text-anchor="middle">Codex Desktop</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="box" x="982" y="132" width="166" height="150" rx="24"/>
    <ellipse cx="1065" cy="170" rx="27" ry="9" fill="#f7f3ff" stroke="#8250df" stroke-width="2"/>
    <path d="M1038 170v30c0 5 12 9 27 9s27-4 27-9v-30m-54 15c0 5 12 9 27 9s27-4 27-9" fill="none" stroke="#8250df" stroke-width="2"/>
    <text class="label" x="1065" y="238" text-anchor="middle">App Server</text>
  </g>
</svg>
