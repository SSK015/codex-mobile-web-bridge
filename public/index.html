<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Codex Mobile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="overlay hidden">
    <form id="login-form" class="card login-card">
      <div class="brand-mark">C</div>
      <h1>Codex Mobile</h1>
      <p>输入这台电脑的访问密码</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required>
      <button type="submit" class="primary">登录</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <header>
    <button id="back" class="icon-button mobile-only" aria-label="返回">←</button>
    <div>
      <strong>Codex Mobile</strong>
      <span id="connection" class="status">连接中</span>
    </div>
    <div class="header-actions">
      <button id="refresh" class="icon-button" aria-label="刷新">↻</button>
      <button id="requests-toggle" class="secondary request-toggle" type="button">请求 <span id="requests-badge" class="request-badge hidden">0</span></button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="搜索 tasks">
      </div>
      <div id="thread-list-status" class="thread-list-status hidden"></div>
      <div id="thread-list" class="thread-list"></div>
    </aside>

    <section id="conversation" class="conversation empty">
      <div id="empty-state" class="empty-state">
        <div class="brand-mark">C</div>
        <h2>选择一个 Codex task</h2>
        <p>手机接管时，桌面端不能同时打开同一 task。</p>
      </div>

      <div id="thread-view" class="hidden thread-view">
        <div class="thread-heading">
          <div>
            <h2 id="thread-title"></h2>
            <p id="thread-meta"></p>
          </div>
          <button id="retry-resume" class="secondary hidden">重试接管</button>
        </div>
        <div id="notice" class="notice hidden"></div>
        <div class="messages-shell">
          <div id="messages" class="messages"></div>
          <button id="jump-bottom" class="jump-bottom hidden" type="button" aria-label="跳到最新消息" title="跳到最新消息">
            <span aria-hidden="true">↓</span>
            <span>最新</span>
          </button>
        </div>
        <div id="approvals" class="approvals"></div>
        <div id="turn-activity" class="turn-activity hidden" role="status" aria-live="polite">
          <span class="turn-activity-spinner" aria-hidden="true"></span>
          <span id="turn-activity-text">Codex 正在思考…</span>
        </div>
        <div id="attachments" class="attachments hidden" aria-live="polite"></div>
        <form id="composer" class="composer">
          <button id="attach" type="button" class="secondary attach-button" aria-label="添加图片或文件">＋</button>
          <input id="attachment-input" type="file" multiple hidden>
          <textarea id="prompt" rows="1" placeholder="给 Codex 发消息…" enterkeyhint="send"></textarea>
          <button id="stop" type="button" class="danger hidden">请求停止</button>
          <button id="send" type="submit" class="primary">发送</button>
        </form>
      </div>
    </section>
  </main>
  <div id="image-viewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="图片查看器">
    <button id="image-viewer-close" class="image-viewer-close" type="button" aria-label="关闭图片">×</button>
    <div id="image-viewer-stage" class="image-viewer-stage">
      <img id="image-viewer-image" alt="">
    </div>
    <div id="image-viewer-caption" class="image-viewer-caption"></div>
  </div>
  <div id="request-drawer" class="request-drawer hidden" role="dialog" aria-modal="true" aria-label="Codex 请求中心">
    <section class="request-drawer-card">
      <div class="request-drawer-heading">
        <div>
          <strong>请求中心</strong>
          <span>审批、问题与外部工具请求</span>
        </div>
        <button id="request-drawer-close" class="icon-button" type="button" aria-label="关闭请求中心">×</button>
      </div>
      <div id="request-panel-list" class="request-panel-list"></div>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
